<!doctype html>
<html lang="zh-CN" class="wa-theme-default wa-palette-default" data-webawesome="/vendor/wa/">
<head>
  <meta charset="utf-8">
  <!-- An application, not an article: pinching a mail client in and out of scale only breaks its
       layout, so page zoom is off and text size comes from the OS setting instead. The CSS side
       of the same decision (touch-action, overscroll) lives in style.css.
       这是应用不是文章:把一个邮件客户端捏大捏小只会弄坏它的版式,所以页面缩放关闭,
       字号大小交给系统设置。同一决定的 CSS 半边(touch-action、overscroll)在 style.css 里。 -->
  <!-- cover: sideways, the page runs under the notch and the background reaches both edges;
       the safe-area insets in style.css keep the CONTENT out of the ears. Upright all four
       insets are zero and nothing changes.
       cover:横屏时页面伸到刘海底下,背景抵达两边;style.css 里的 safe-area 内边距
       让**内容**避开两只耳朵。竖屏四个内边距全为零,一切照旧。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <!-- Added to a home screen, this runs without the browser's own chrome around it. The status
       bar is deliberately left at the default rather than made translucent: translucent means the
       page reaches under it, and everything here would then need a safe-area inset to stay clear
       of the notch. What colour that bar takes is decided by the theme the company chose, and
       app.js writes it to <meta name="theme-color"> once it knows which one won.
       加到主屏后,它不带浏览器外壳运行。状态栏刻意保持默认而不做成半透明:
       半透明意味着页面要伸到它底下,那样这里的每一样东西都得加一圈安全区内边距才躲得开刘海。
       那条栏取什么颜色,由这家企业选的主题决定;app.js 一旦知道是哪套,就写进 theme-color。 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CFMail</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b57d0' d='M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z'/%3E%3C/svg%3E">
  <script>
    (function () {
      var h = document.documentElement;
      h.dataset.theme = localStorage.getItem('cfmail_theme') || 'blue';
      var m = localStorage.getItem('cfmail_mode') || 'auto';
      var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      h.classList.add(dark ? 'wa-dark' : 'wa-light');
    })();
  </script>
  <link rel="stylesheet" href="/vendor/wa/styles/webawesome.css">
  <link rel="stylesheet" href="/vendor/wa/styles/themes/default.css">
  <link rel="stylesheet" href="/assets/themes.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module">
    import { registerIconLibrary } from '/vendor/wa/webawesome.loader.js';
    import { iconDataUri } from '/assets/icons.js';
    // The elements every shell is built from, defined before any shell is drawn. Left to the
    // autoloader they arrive after the first paint: a bar of bare text and empty icons for a
    // frame, then the real buttons -- the "flash" on every reload. Defined up front, the
    // markup is created already upgraded and the first frame is the right one. These few
    // fetch in parallel with the sign-in and bootstrap requests, so nothing waits on them.
    // 每个外壳都由这几种元素组成,在画任何外壳之前先定义好。交给自动加载器的话它们在首帧之后才到:
    // 先是一帧光秃秃的文字和空图标,然后才是真正的按钮 —— 每次刷新都闪的就是这个。
    // 提前定义,标记一创建就是升级后的形态,首帧就是对的那一帧。这几个文件与登录、
    // 引导请求并行取回,没有任何东西在等它们。
    import '/vendor/wa/components/button/button.js';
    import '/vendor/wa/components/icon/icon.js';
    import '/vendor/wa/components/dropdown/dropdown.js';
    import '/vendor/wa/components/dropdown-item/dropdown-item.js';
    import '/vendor/wa/components/select/select.js';
    import '/vendor/wa/components/option/option.js';
    import '/vendor/wa/components/switch/switch.js';
    import '/vendor/wa/components/checkbox/checkbox.js';
    import '/vendor/wa/components/spinner/spinner.js';
    import '/vendor/wa/components/toast/toast.js';
    registerIconLibrary('default', { resolver: (name) => iconDataUri(name) });
  </script>
</head>
<body>
  <div id="app"><div class="boot-loading" id="boot"></div></div>
  <script>
    (function () {
      // The company this browser saw last time, cached by loadBrand(). The real one arrives over
      // the network a moment later; painting it now means the very first frame belongs to the
      // company rather than announcing the product to its own staff. Nothing cached (a first
      // visit) leaves the spinner alone -- better a bare spinner than someone else's name.
      // 本浏览器上次见到的企业,由 loadBrand() 缓存。真实值稍后经网络到达;此刻先画出来,
      // 第一帧便属于这家企业,而不是向它自己的员工报出产品名。没有缓存(首次访问)就只留
      // 加载动画 —— 一个光秃秃的动画,好过别人的名字。
      try {
        var b = JSON.parse(localStorage.getItem('cfmail_brand') || 'null');
        if (!b) return;
        if (b.font) document.documentElement.style.setProperty('--font-brand', b.font);
        var box = document.getElementById('boot');
        var wrap = document.createElement('div');
        wrap.className = 'brand-lockup';
        if (b.logo) {
          var im = document.createElement('img');
          im.className = 'brand-logo';
          im.setAttribute('data-logo-mode', b.logoMode || 'light');
          im.src = b.logo;
          wrap.appendChild(im);
        }
        if (b.name) {
          var sp = document.createElement('span');
          sp.textContent = b.name;   // a name is text, never markup / 名称是文本,绝不是标记
          wrap.appendChild(sp);
        }
        if (wrap.childNodes.length) box.appendChild(wrap);
      } catch (e) {}
    })();
  </script>
  <div id="compose-root"></div>
  <wa-toast id="toast-stack" placement="bottom-start"></wa-toast>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
