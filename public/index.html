<!doctype html>
<html lang="zh-CN" class="wa-theme-default wa-palette-default" data-webawesome="/vendor/wa/">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>CFMail</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b57d0' d='M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z'/%3E%3C/svg%3E">
  <script>
    (function () {
      var h = document.documentElement;
      h.dataset.theme = localStorage.getItem('cfmail_theme') || 'blue';
      var m = localStorage.getItem('cfmail_mode') || 'auto';
      var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      h.classList.add(dark ? 'wa-dark' : 'wa-light');
    })();
  </script>
  <link rel="stylesheet" href="/vendor/wa/styles/webawesome.css">
  <link rel="stylesheet" href="/vendor/wa/styles/themes/default.css">
  <link rel="stylesheet" href="/assets/themes.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module">
    import { registerIconLibrary } from '/vendor/wa/webawesome.loader.js';
    import { iconDataUri } from '/assets/icons.js';
    registerIconLibrary('default', { resolver: (name) => iconDataUri(name) });
  </script>
</head>
<body>
  <div id="app"><div class="boot-loading" id="boot"></div></div>
  <script>
    (function () {
      // The company this browser saw last time, cached by loadBrand(). The real one arrives over
      // the network a moment later; painting it now means the very first frame belongs to the
      // company rather than announcing the product to its own staff. Nothing cached (a first
      // visit) leaves the spinner alone -- better a bare spinner than someone else's name.
      // 本浏览器上次见到的企业,由 loadBrand() 缓存。真实值稍后经网络到达;此刻先画出来,
      // 第一帧便属于这家企业,而不是向它自己的员工报出产品名。没有缓存(首次访问)就只留
      // 加载动画 —— 一个光秃秃的动画,好过别人的名字。
      try {
        var b = JSON.parse(localStorage.getItem('cfmail_brand') || 'null');
        if (!b) return;
        if (b.font) document.documentElement.style.setProperty('--font-brand', b.font);
        var box = document.getElementById('boot');
        var wrap = document.createElement('div');
        wrap.className = 'brand-lockup';
        if (b.logo) {
          var im = document.createElement('img');
          im.className = 'brand-logo';
          im.setAttribute('data-logo-mode', b.logoMode || 'light');
          im.src = b.logo;
          wrap.appendChild(im);
        }
        if (b.name) {
          var sp = document.createElement('span');
          sp.textContent = b.name;   // a name is text, never markup / 名称是文本,绝不是标记
          wrap.appendChild(sp);
        }
        if (wrap.childNodes.length) box.appendChild(wrap);
      } catch (e) {}
    })();
  </script>
  <div id="compose-root"></div>
  <wa-toast id="toast-stack" placement="bottom-start"></wa-toast>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
